<body>
  {% include nav.html %}

  {% include footer.html %}
  {% include cookie-consent.html %}
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      function sync() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.setAttribute('aria-pressed', dark);
      }
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      });
      sync();
    })();
  </script>
  <script>
    (function () {
      var navToggle = document.getElementById('nav-toggle');
      var navMenu = document.getElementById('nav-menu');
      if (!navToggle || !navMenu) return;
      function close() {
        navMenu.classList.remove('open');
        navToggle.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
      }
      navToggle.addEventListener('click', function () {
        var open = navMenu.classList.toggle('open');
        navToggle.classList.toggle('open', open);
        navToggle.setAttribute('aria-expanded', open);
      });
      navMenu.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', close);
      });
    })();
  </script>
  <script>
    (function () {
      var el = document.getElementById('copyright-year');
      if (el) el.textContent = new Date().getFullYear();
    })();
  </script>
  <script>
    (function () {
      var btns = document.querySelectorAll('.share-copy');
      if (!btns.length) return;
      btns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var url = btn.getAttribute('data-url');
          var done = function () {
            btn.classList.add('copied');
            btn.setAttribute('aria-label', 'Link copied');
            setTimeout(function () {
              btn.classList.remove('copied');
              btn.setAttribute('aria-label', 'Copy link');
            }, 2000);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done).catch(function () {});
          } else {
            var t = document.createElement('textarea');
            t.value = url;
            document.body.appendChild(t);
            t.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            document.body.removeChild(t);
          }
        });
      });
    })();
  </script>
  <script>
    (function () {
      var banner = document.getElementById('cookie-banner');
      var modal = document.getElementById('cookie-settings');
      var toggle = document.getElementById('cc-analytics');
      var adToggle = document.getElementById('cc-advertising');
      var KEY = 'cookieConsent';

      function read() {
        try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
      }
      function save(consent) {
        try { localStorage.setItem(KEY, JSON.stringify(consent)); } catch (e) {}
      }
      // Push per-category consent to GTM (Consent Mode v2), then load GTM if any granted
      function apply(consent) {
        if (!consent) return;
        if (typeof window.gtag === 'function') {
          window.gtag('consent', 'update', {
            analytics_storage: consent.analytics ? 'granted' : 'denied',
            ad_storage:        consent.advertising ? 'granted' : 'denied',
            ad_user_data:      consent.advertising ? 'granted' : 'denied',
            ad_personalization: consent.advertising ? 'granted' : 'denied'
          });
        }
        if ((consent.analytics || consent.advertising) && typeof window.loadGTM === 'function') {
          window.loadGTM();
        }
      }
      function showBanner() {
        if (!banner) return;
        banner.hidden = false;
        // let the hidden state paint, then transition in
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { banner.classList.add('cookie-visible'); });
        });
      }
      function hideBanner() {
        if (!banner) return;
        banner.classList.remove('cookie-visible');
        setTimeout(function () { banner.hidden = true; }, 400);
      }
      function openModal() {
        if (!modal) return;
        var c = read();
        if (toggle) toggle.checked = !!(c && c.analytics);
        if (adToggle) adToggle.checked = !!(c && c.advertising);
        modal.hidden = false;
      }
      function closeModal() { if (modal) modal.hidden = true; }

      function decide(consent) {
        save(consent);
        apply(consent);
        hideBanner();
        closeModal();
      }

      // Wire up any element carrying a data-cc action (banner + modal)
      document.querySelectorAll('[data-cc]').forEach(function (el) {
        el.addEventListener('click', function () {
          switch (el.getAttribute('data-cc')) {
            case 'accept':   decide({ analytics: true, advertising: true }); break;
            case 'reject':   decide({ analytics: false, advertising: false }); break;
            case 'save':     decide({ analytics: !!(toggle && toggle.checked), advertising: !!(adToggle && adToggle.checked) }); break;
            case 'settings': openModal(); break;
            case 'close':    closeModal(); break;
          }
        });
      });

      // Footer "Cookie settings" link can reopen the modal anytime
      var reopen = document.getElementById('open-cookie-settings');
      if (reopen) reopen.addEventListener('click', function (e) { e.preventDefault(); openModal(); });

      // Escape closes the modal
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal && !modal.hidden) closeModal();
      });

      // On load: honor a prior choice, otherwise prompt after a short, graceful delay
      var existing = read();
      if (existing) { apply(existing); } else { setTimeout(showBanner, 600); }
    })();
  </script>
  {% if site.hubspot_portal_id and site.hubspot_form_id %}
  <script>
    (function () {
      // Contact form -> HubSpot Forms API. No HubSpot script or cookies are loaded;
      // the endpoint host is EU-specific because the portal is EU-hosted.
      var form = document.getElementById('contact-form');
      if (!form) return;

      var ENDPOINT = 'https://{{ site.hubspot_api_host }}/submissions/v3/integration/submit/{{ site.hubspot_portal_id }}/{{ site.hubspot_form_id }}';
      var FIELDS = ['firstname', 'lastname', 'email', 'message'];
      var errorEl = document.getElementById('contact-error');
      var btn = form.querySelector('.form-submit');
      var label = form.querySelector('.form-submit-label');
      var defaultLabel = label ? label.textContent : '';

      function showError(msg) {
        if (!errorEl) return;
        errorEl.textContent = msg;
        errorEl.hidden = false;
      }
      function clearError() {
        if (errorEl) errorEl.hidden = true;
      }
      function setBusy(busy) {
        if (btn) btn.disabled = busy;
        if (label) label.textContent = busy ? 'Sending…' : defaultLabel;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        // Let native validation handle empty/invalid fields first.
        if (typeof form.reportValidity === 'function' && !form.reportValidity()) return;
        clearError();
        setBusy(true);

        var fields = [];
        FIELDS.forEach(function (name) {
          var input = form.elements[name];
          if (input && input.value.trim()) {
            fields.push({ name: name, value: input.value.trim() });
          }
        });

        fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: fields,
            context: {
              pageUri: window.location.href,
              pageName: document.title
            }
          })
        }).then(function (res) {
          if (res.ok) {
            window.location = '{{ "/thanks/" | relative_url }}';
            return;
          }
          setBusy(false);
          showError('Sorry — something went wrong sending your message. Please try again, or email me directly.');
        }).catch(function () {
          setBusy(false);
          showError('Sorry — your message could not be sent. Please check your connection and try again.');
        });
      });
    })();
  </script>
  {% endif %}
</body>
</html>

---
layout: default
title: Contact
description: Get in touch with Ryan Abrams.
permalink: /contact/
---

<div class="contact-wrap">
  <p class="label">Get in touch</p>
  <h1>Let's talk.</h1>
  <p class="sub">Have a question or want to work together? Fill in the form and I'll get back to you.</p>

  <form
    class="contact-form"
    action="https://formspree.io/f/{{ site.formspree_id }}"
    method="POST">

    <div class="form-row">
      <div class="form-group">
        <label for="fname">First name</label>
        <input type="text" id="fname" name="first_name" placeholder="John" required>
      </div>
      <div class="form-group">
        <label for="lname">Last name</label>
        <input type="text" id="lname" name="last_name" placeholder="Smith" required>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="john@example.com" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell me what's on your mind…" required></textarea>
    </div>

    <button type="submit" class="form-submit">
      Send message
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </form>
</div>
